<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LSS Admin — مراقبة المستخدمين</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-box {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 1rem;
      padding: 2rem;
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    .login-box h2 { margin-bottom: 1rem; color: #f1f5f9; }
    .login-box input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 0.5rem;
      background: rgba(15, 23, 42, 0.6);
      color: #e2e8f0;
      font-size: 1rem;
      margin-bottom: 1rem;
      direction: ltr;
      text-align: center;
    }
    .login-box button {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #10b981, #34d399);
      border: none;
      border-radius: 0.5rem;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .login-box button:hover { filter: brightness(1.1); }
    .login-box .error { color: #ef4444; font-size: 0.85rem; margin-top: 0.5rem; }

    .dashboard { display: none; max-width: 800px; width: 100%; }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
    }
    .header .logo {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #10b981, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .badge {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
    }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 0.75rem;
      padding: 1.25rem;
      text-align: center;
    }
    .stat-card .value { font-size: 2rem; font-weight: 800; color: #34d399; }
    .stat-card .label { font-size: 0.85rem; color: #94a3b8; margin-top: 0.25rem; }
    .section { margin-bottom: 2rem; }
    .section h3 {
      font-size: 1.1rem;
      color: #f1f5f9;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }
    .bar-chart { display: flex; flex-direction: column; gap: 0.5rem; }
    .bar-row { display: flex; align-items: center; gap: 0.75rem; }
    .bar-label { min-width: 80px; font-size: 0.85rem; color: #94a3b8; text-align: left; direction: ltr; }
    .bar-track { flex: 1; height: 24px; background: rgba(15, 23, 42, 0.6); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
    .bar-fill.tutor { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
    .bar-fill.student { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
    .bar-count { min-width: 40px; font-size: 0.85rem; color: #e2e8f0; text-align: center; }
    .activity-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .activity-row {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0.75rem;
      background: rgba(15, 23, 42, 0.4);
      border-radius: 0.5rem;
      font-size: 0.85rem;
    }
    .activity-row .date { color: #94a3b8; }
    .activity-row .count { color: #34d399; font-weight: bold; }
    footer { text-align: center; color: #475569; font-size: 0.75rem; margin-top: 2rem; }
  </style>
</head>
<body>

  <!-- Login -->
  <div class="login-box" id="login">
    <h2>🔒 لوحة المراقبة</h2>
    <input type="password" id="pwd" placeholder="أدخل كلمة المرور" autofocus />
    <button onclick="doLogin()">دخول</button>
    <div class="error" id="loginErr"></div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dash">
    <div class="header">
      <div>
        <div class="logo">LSS</div>
        <p style="color:#94a3b8;font-size:0.9rem">مراقبة المستخدمين</p>
      </div>
      <div>
        <span class="badge" id="lastUpdated"></span>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="value" id="totalDevices">—</div>
        <div class="label">إجمالي الأجهزة الفريدة</div>
      </div>
      <div class="stat-card">
        <div class="value" id="tutorTotal" style="color:#60a5fa">—</div>
        <div class="label"> أجهزة Tutor</div>
      </div>
      <div class="stat-card">
        <div class="value" id="studentTotal" style="color:#a78bfa">—</div>
        <div class="label">أجهزة Student</div>
      </div>
    </div>

    <div class="section">
      <h3>📊 التوزيع حسب الإصدار</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem">
        <div>
          <p style="color:#60a5fa;font-weight:bold;margin-bottom:0.5rem">🎓 Tutor</p>
          <div class="bar-chart" id="tutorVersions"></div>
        </div>
        <div>
          <p style="color:#a78bfa;font-weight:bold;margin-bottom:0.5rem">💻 Student</p>
          <div class="bar-chart" id="studentVersions"></div>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>📅 النشاط اليومي (آخر 7 أيام)</h3>
      <div class="activity-list" id="dailyActivity"></div>
    </div>

    <footer>
      <p>LSS Update Tracker — Netlify Functions + Supabase</p>
      <p style="margin-top:0.3rem">muaath-nasser.com</p>
    </footer>
  </div>

  <script>
    let PASSWORD = "";

    async function doLogin() {
      PASSWORD = document.getElementById("pwd").value;
      if (!PASSWORD) return;
      try {
        const res = await fetch("https://cqrzvydxxybfhlmllxeh.functions.supabase.co/track-stats?password=" + encodeURIComponent(PASSWORD));
        if (!res.ok) throw new Error("Invalid password");
        const data = await res.json();
        document.getElementById("login").style.display = "none";
        document.getElementById("dash").style.display = "block";
        render(data);
      } catch (e) {
        document.getElementById("loginErr").textContent = "كلمة المرور غير صحيحة";
      }
    }

    document.getElementById("pwd").addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });

    function render(data) {
      document.getElementById("totalDevices").textContent = data.totalDevices;
      document.getElementById("tutorTotal").textContent = data.tutor.total;
      document.getElementById("studentTotal").textContent = data.student.total;
      document.getElementById("lastUpdated").textContent =
        "آخر تحديث: " + new Date(data.lastUpdated).toLocaleString("ar");

      renderBars("tutorVersions", data.tutor.versions, "tutor");
      renderBars("studentVersions", data.student.versions, "student");
      renderActivity(data.dailyActivity);
    }

    function renderBars(containerId, versions, cls) {
      const el = document.getElementById(containerId);
      const total = Object.values(versions).reduce((a, b) => a + b, 0) || 1;
      el.innerHTML = Object.entries(versions)
        .sort(([a], [b]) => b.localeCompare(a))
        .map(([ver, count]) => {
          const pct = Math.round((count / total) * 100);
          return `
            <div class="bar-row">
              <span class="bar-label">v${ver}</span>
              <div class="bar-track">
                <div class="bar-fill ${cls}" style="width:${pct}%"></div>
              </div>
              <span class="bar-count">${count}</span>
            </div>`;
        }).join("");
    }

    function renderActivity(daily) {
      const el = document.getElementById("dailyActivity");
      const entries = Object.entries(daily).sort(([a], [b]) => b.localeCompare(a));
      if (entries.length === 0) {
        el.innerHTML = '<div class="activity-row"><span class="date">لا توجد بيانات بعد</span></div>';
        return;
      }
      el.innerHTML = entries.map(([date, count]) => `
        <div class="activity-row">
          <span class="date">${date}</span>
          <span class="count">${count} طلب</span>
        </div>`).join("");
    }
  </script>
</body>
</html>
